name: Check approved selflove changes
on:
  push:
    branches: [codex/selflove-copy-20261002]
    paths: [.github/workflows/selflove-refine.yml]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the reviewed patch and checks with the narrow-screen dialogue fix
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin ac5144b54c48b1be011cc353c8425f4e0925c771
          git show ac5144b54c48b1be011cc353c8425f4e0925c771:.github/workflows/selflove-refine.yml >/tmp/reviewed-workflow.yml
          python -m pip install --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          steps=yaml.safe_load(Path('/tmp/reviewed-workflow.yml').read_text())['jobs']['check']['steps']
          prep=steps[1]['run']
          assert prep.count('내가 나를 좋아하겠다는데')==1
          prep=prep.replace('내가 나를 좋아하겠다는데','내가 나 좋다는데')
          checks=steps[2]['run'].replace('await page.waitForTimeout(1480);',"await page.waitForFunction(()=>G.tier>=1,null,{timeout:15000});")
          for name,text in [('prepare',prep),('check',checks),('save',steps[4]['run'])]:
              Path('/tmp/selflove-'+name+'.sh').write_text(text)
          PY
          bash /tmp/selflove-prepare.sh
          bash /tmp/selflove-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selflove-review
          path: /tmp/selflove-evidence
          retention-days: 3
      - name: Save checked files on the isolated branch
        shell: bash
        run: bash /tmp/selflove-save.sh
