<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>스스로를 사랑하기</title>
<link rel="icon" href="./favicon.ico?v=20261002" sizes="any">
<link rel="icon" type="image/svg+xml" href="./favicon.svg?v=20261002">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20261002">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--or:#F07526;--pk:#F6A1B6;--cr:#FFF4DC;--vi:#3A2F7A;--dk:#2A1238;--bl:#3A1430;--mv:#B85A8E}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:'Song Myung',serif;color:var(--dk);background:#F3C7A6;
  display:flex;align-items:center;justify-content:center;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
#app{position:relative;width:min(100vw,560px);height:100%;max-height:1000px;overflow:hidden;background:var(--or)}
#app.shake{animation:shk .36s cubic-bezier(.36,.07,.19,.97)}
@keyframes shk{10%{transform:translate(-8px,4px) rotate(-.6deg)}28%{transform:translate(9px,-5px) rotate(.7deg)}
  46%{transform:translate(-7px,-2px) rotate(-.4deg)}64%{transform:translate(5px,4px) rotate(.3deg)}
  82%{transform:translate(-3px,-1px)}100%{transform:translate(0,0)}}
#gl{position:absolute;inset:0;display:block;width:100%;height:100%;z-index:1}
/* 캔버스 천 질감 */
#weave{position:absolute;inset:0;z-index:2;pointer-events:none;mix-blend-mode:multiply;opacity:.62;
  background-image:var(--weave);background-size:160px 160px}
#flash{position:absolute;inset:0;background:#B83A28;opacity:0;pointer-events:none;z-index:9;mix-blend-mode:multiply}
#flash.on{animation:fl .4s}
@keyframes fl{0%{opacity:.55}100%{opacity:0}}

/* 얼굴 인내심 */
#pat{position:absolute;top:calc(12px + env(safe-area-inset-top));left:16px;display:flex;gap:5px;height:16px;z-index:11}
#pat div{flex:0 0 7px;height:16px;border-radius:3px 1px 4px 2px;background:var(--cr);
  box-shadow:1px 1px 0 rgba(58,20,48,.5);transition:opacity .3s,transform .3s}
#pat div.off{opacity:.3;transform:scaleY(.6)}
#pat.hit{animation:phit .34s}
@keyframes phit{0%,100%{transform:translateX(0)}30%{transform:translateX(-6px)}70%{transform:translateX(6px)}}
#pat.heal{animation:pheal .62s}
@keyframes pheal{0%{transform:scaleY(1)}30%{transform:scaleY(1.6)}62%{transform:scaleY(.9)}100%{transform:scaleY(1)}}

/* 점수 */
#score{position:absolute;top:calc(36px + env(safe-area-inset-top));left:16px;z-index:10;pointer-events:none}
#scoreLab{font-size:14px;line-height:1.2;color:var(--cr)}
#scoreLab .hh{color:var(--vi)}
#scoreNum{font-size:54px;line-height:.95;color:var(--cr);margin-top:2px;text-shadow:2px 3px 0 var(--bl)}
#scoreNum.bump{animation:bump .3s ease-out}
@keyframes bump{0%{transform:scale(1)}42%{transform:scale(1.3) rotate(-4deg)}100%{transform:scale(1)}}
#gain{position:absolute;left:74px;top:24px;font-size:30px;color:var(--cr);text-shadow:1px 2px 0 var(--bl);opacity:0}
#gain.on{animation:gain .85s ease-out}
@keyframes gain{0%{opacity:0;transform:translateY(4px)}18%{opacity:1}100%{opacity:0;transform:translateY(-32px)}}

/* 말풍선 — 내 머리 위에 붙는다 */
#say{position:absolute;left:0;top:0;z-index:7;max-width:62%;width:max-content;
  transform:translateY(-100%);transform-origin:var(--tx,50%) 100%;
  font-size:17px;line-height:1.3;color:var(--dk);background:var(--cr);
  border-radius:14px 4px 16px 6px;padding:8px 13px;box-shadow:3px 3px 0 var(--vi);
  word-break:keep-all;opacity:0;transition:opacity .14s;pointer-events:none}
#say.on{opacity:1}
#say.pop{animation:pop .24s}
@keyframes pop{0%{transform:translateY(-100%) scale(.82)}58%{transform:translateY(-100%) scale(1.07)}100%{transform:translateY(-100%) scale(1)}}
#say:after{content:"";position:absolute;left:var(--tx,50%);top:100%;width:12px;height:12px;margin-left:-6px;
  background:var(--cr);transform:translateY(-6px) rotate(45deg)}

/* 얼굴이 세는 숫자 */
#cnt{position:absolute;right:22px;top:19%;z-index:11;width:72px;height:72px;
  font-size:48px;line-height:1;color:var(--cr);background:var(--vi);border-radius:50% 46% 52% 44%;
  box-shadow:3px 4px 0 var(--bl);display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s;pointer-events:none}
#cnt.on{opacity:1}
#cnt.tick{animation:cnt .4s}
@keyframes cnt{0%{transform:scale(1.5)}55%{transform:scale(.92)}100%{transform:scale(1)}}

/* 하단 */
#hud{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
#stage{display:flex;align-items:baseline;gap:8px;height:26px}
#stageName{font-size:18px;color:var(--dk)}
#stagePt{font-size:20px;color:var(--vi)}
#ladder{display:flex;gap:4px;height:7px;margin:4px 0 10px}
#ladder div{flex:1 1 auto;border-radius:2px;background:rgba(58,20,48,.25);transition:background .12s}
#ladder div.on{background:var(--cr)}
#ladder div.top.on{background:var(--vi)}
#hold{width:100%;height:76px;border:none;border-radius:6px 14px 6px 12px;background:var(--cr);color:var(--dk);
  font-family:'Song Myung',serif;font-size:24px;position:relative;overflow:hidden;cursor:pointer;
  box-shadow:4px 5px 0 var(--bl);transition:opacity .14s}
#hold.cool{opacity:.55}
#hold.down{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--bl)}
#hold .fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#F6A1B6,#B85A8E 60%,#7D3B9C);z-index:0}
#hold.top .fill{background:linear-gradient(90deg,#B85A8E,#3A2F7A)}
#hold .ticks{position:absolute;inset:0;z-index:1}
#hold .ticks i{position:absolute;top:0;bottom:0;width:2px;background:rgba(58,20,48,.22)}
#hold .txt{position:relative;z-index:2;text-shadow:0 0 4px var(--cr),0 0 2px var(--cr)}
#hold:focus-visible{outline:3px solid var(--vi);outline-offset:3px}

/* 오버레이 — 게임과 같은 주황 벽, 분홍 바닥 */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px;text-align:center;
  background:linear-gradient(180deg,var(--or) 0%,var(--or) 61%,var(--pk) 61%,var(--pk) 100%)}
.ov:before{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.62;
  background-image:var(--weave);background-size:160px 160px}
.ov>*{position:relative;z-index:1}
.ov.hide{display:none}
.ov h1{font-family:'Song Myung',serif;font-weight:400;font-size:54px;line-height:1.08;margin:0;color:var(--cr);
  text-shadow:3px 4px 0 var(--bl)}
.ov h1 .hh{color:var(--vi);text-shadow:none}
.ov .go{margin-top:26px;padding:14px 34px;border:none;border-radius:6px 14px 6px 12px;background:var(--cr);color:var(--dk);
  font-family:'Song Myung',serif;font-size:22px;cursor:pointer;box-shadow:4px 5px 0 var(--bl)}
.ov .go:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--bl)}
#endLab,#rankLab{font-size:24px;color:var(--cr);text-shadow:2px 2px 0 var(--bl)}
#endLab .hh,#rankLab .hh{color:var(--vi);text-shadow:none}
#endScore{font-size:112px;line-height:.95;margin:4px 0 0;color:var(--cr);text-shadow:4px 5px 0 var(--bl)}
#rankBox{margin-top:18px;width:100%;max-width:310px;padding:12px 12px 10px;
  background:rgba(255,244,220,.95);border-radius:8px 16px 8px 14px;box-shadow:4px 5px 0 var(--bl)}
#rankForm{display:flex;gap:7px;margin-bottom:10px}
#nameIn{flex:1 1 auto;min-width:0;padding:10px 12px;border:2px solid var(--vi);border-radius:8px;
  font-size:17px;font-family:'Gowun Dodum',sans-serif;background:#fff;color:var(--dk)}
#nameIn:focus{outline:none;border-color:var(--mv)}
#btnSubmit{flex:0 0 auto;padding:10px 16px;border:none;border-radius:8px;background:var(--vi);
  color:var(--cr);font-family:'Song Myung',serif;font-size:17px;cursor:pointer}
#btnSubmit:disabled{opacity:.45;cursor:default}
.rank{list-style:none;margin:0;padding:0;font-family:'Gowun Dodum',sans-serif;font-size:16px;color:var(--dk);text-align:left;
  overflow:auto;-webkit-overflow-scrolling:touch}
#rankList{max-height:170px}
#rankAll{max-height:46vh;width:100%;max-width:310px;margin-top:14px;padding:8px 12px;
  background:rgba(255,244,220,.95);border-radius:8px 16px 8px 14px;box-shadow:4px 5px 0 var(--bl)}
.rank li{display:flex;gap:9px;padding:4px 2px;border-bottom:1px solid rgba(58,20,48,.12)}
.rank li .n{flex:0 0 22px;color:#8A6A80;font-variant-numeric:tabular-nums}
.rank li .w{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li .s{flex:0 0 auto;font-variant-numeric:tabular-nums}
.rank li.mine{color:var(--vi);font-weight:700}
#rankMsg{font-family:'Gowun Dodum',sans-serif;font-size:14px;color:var(--dk);margin-top:6px;min-height:18px}
#rankAllMsg{font-family:'Gowun Dodum',sans-serif;font-size:15px;color:var(--cr);text-shadow:1px 1px 0 var(--bl);margin-top:10px;min-height:18px}

.tool{position:absolute;top:calc(14px + env(safe-area-inset-top));z-index:12;background:var(--cr);border:none;
  border-radius:6px 10px 6px 9px;box-shadow:2px 3px 0 var(--bl);font-size:15px;padding:3px 9px;cursor:pointer;color:var(--dk)}
#sndBtn{right:14px;font-size:18px;line-height:1;padding:6px 9px}
/* 시작 — 우로보로스 */
#ouro{margin-top:20px;position:relative;width:min(62vw,270px);aspect-ratio:1/1;border:none;background:none;
  padding:0;cursor:pointer;display:block;transition:transform .1s}
#ouro:active{transform:scale(.94)}
#ouro:focus-visible{outline:none}
#ouro:focus-visible .halo{opacity:.9}
#ouro canvas{display:block;width:100%;height:100%;position:relative;z-index:1}
#ouro .halo{position:absolute;inset:-6%;border-radius:50%;z-index:0;
  background:radial-gradient(circle,rgba(255,244,220,.55) 36%,rgba(255,244,220,0) 68%);
  animation:halo 2.9s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.9);opacity:.5}50%{transform:scale(1.06);opacity:1}}
#ouroCap{margin-top:2px;font-size:24px;color:var(--cr);text-shadow:2px 2px 0 var(--bl);pointer-events:none}
/* 순위 — 크기 다른 하트 세 개 */
#rankBtn{margin-top:22px;border:none;background:none;padding:6px 10px;cursor:pointer;
  width:min(40vw,158px);display:block;transition:transform .1s}
#rankBtn:active{transform:scale(.92)}
#rankBtn svg{display:block;width:100%;height:auto;overflow:visible}
#rankBtn:focus-visible{outline:3px solid var(--vi);outline-offset:4px;border-radius:12px}
#nogl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  padding:30px;text-align:center;font-size:20px;color:var(--cr);text-shadow:1px 1px 0 var(--bl);z-index:30}
/* 오락실 링크: 점수, 소리 버튼, 누르기 영역과 분리 */
#arcadeLink{position:absolute;right:14px;top:calc(64px + env(safe-area-inset-top));z-index:31;
  display:block;width:36px;height:36px;padding:4px;line-height:0;opacity:.9;touch-action:manipulation}
#arcadeLink svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(1px 2px 1.5px #0006)}
#arcadeLink:active svg{transform:scale(.88)}
#arcadeLink:focus-visible{outline:3px solid var(--vi);outline-offset:3px}
#app:has(.ov:not(.hide)) #arcadeLink{top:calc(18px + env(safe-area-inset-top))}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <a id="arcadeLink" href="https://aaffffffffff123-lang.github.io/arcade/" aria-label="혐규오락실로 돌아가기">
    <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M24.00 2.84 C27.19 2.93 30.48 3.49 33.44 4.70 C36.39 5.91 39.79 7.65 41.72 10.08 C43.64 12.51 44.41 16.18 44.97 19.28 C45.53 22.39 45.73 25.72 45.08 28.74 C44.42 31.76 43.07 35.11 41.06 37.40 C39.05 39.69 35.87 41.15 33.03 42.47 C30.19 43.79 27.09 45.14 24.00 45.31 C20.91 45.47 17.40 44.72 14.49 43.46 C11.58 42.19 8.30 40.21 6.54 37.72 C4.78 35.22 4.45 31.57 3.93 28.51 C3.41 25.45 2.76 22.23 3.42 19.37 C4.08 16.52 6.10 13.90 7.91 11.36 C9.72 8.82 11.61 5.56 14.29 4.14 C16.97 2.72 20.81 2.75 24.00 2.84 Z" fill="#221D1F"/><g stroke="#EFF1EC" stroke-width="2.2" stroke-linecap="round" fill="none"><path d="M13.2 8.4V17.9"/><path d="M20.4 6.2V16.6"/><path d="M27.6 6.2V16.6"/><path d="M34.6 8.8V18.3"/></g><g fill="#EFF1EC"><ellipse cx="18.1" cy="25.2" rx="2" ry="2.3"/><ellipse cx="29.9" cy="25.2" rx="2" ry="2.3"/></g><path d="M19.9 32.3a4.6 4.6 0 0 0 8.2 0" fill="none" stroke="#EFF1EC" stroke-width="2.3" stroke-linecap="round"/></svg>
  </a>
  <canvas id="gl"></canvas>
  <div id="weave"></div>
  <div id="flash"></div>

  <div id="pat"></div>

  <div id="score">
    <div id="scoreLab">나를 사랑해준 횟수 <span class="hh">♥</span></div>
    <div id="scoreNum">0</div>
    <div id="gain"></div>
  </div>

  <div id="say"></div>
  <div id="cnt"></div>

  <div id="hud">
    <div id="stage"><span id="stageName">&nbsp;</span><span id="stagePt"></span></div>
    <div id="ladder"></div>
    <button id="hold"><span class="fill"></span><span class="ticks"></span>
      <span class="txt">꾹 누르고 있기</span></button>
  </div>

  <button id="sndBtn" class="tool" aria-label="소리">🔊</button>

  <div class="ov" id="ovStart">
    <h1>스스로를<br>사랑하기 <span class="hh">♥</span></h1>
    <button id="ouro" aria-label="시작"><span class="halo"></span></button>
    <div id="ouroCap">시작</div>
    <button id="rankBtn" aria-label="순위">
      <svg viewBox="0 0 120 46" aria-hidden="true">
        <g fill="#FFF4DC" stroke="#3A1430" stroke-width="2.1" stroke-linejoin="round">
          <path transform="translate(24,28.9) scale(1.15)"
            d="M0,6.5 C-8.5,0.5 -8.5,-7 -3.4,-7 C-1.1,-7 0,-5.4 0,-4.2 C0,-5.4 1.1,-7 3.4,-7 C8.5,-7 8.5,0.5 0,6.5 Z"/>
          <path transform="translate(97,30.6) scale(.85)"
            d="M0,6.5 C-8.5,0.5 -8.5,-7 -3.4,-7 C-1.1,-7 0,-5.4 0,-4.2 C0,-5.4 1.1,-7 3.4,-7 C8.5,-7 8.5,0.5 0,6.5 Z"/>
        </g>
        <path transform="translate(60,25.9) scale(1.55)" fill="#B85A8E" stroke="#3A1430"
          stroke-width="1.55" stroke-linejoin="round"
          d="M0,6.5 C-8.5,0.5 -8.5,-7 -3.4,-7 C-1.1,-7 0,-5.4 0,-4.2 C0,-5.4 1.1,-7 3.4,-7 C8.5,-7 8.5,0.5 0,6.5 Z"/>
      </svg>
    </button>
  </div>

  <div class="ov hide" id="ovRank">
    <div id="rankLab">나를 사랑해준 횟수 <span class="hh">♥</span></div>
    <ol id="rankAll" class="rank"></ol>
    <div id="rankAllMsg"></div>
    <button class="go" id="btnRankClose">닫기</button>
  </div>

  <div class="ov hide" id="ovEnd">
    <div id="endLab">나를 사랑해준 횟수 <span class="hh">♥</span></div>
    <div id="endScore">0</div>
    <div id="rankBox">
      <div id="rankForm">
        <input id="nameIn" maxlength="8" placeholder="이름" autocomplete="off">
        <button id="btnSubmit">등록</button>
      </div>
      <ol id="rankList" class="rank"></ol>
      <div id="rankMsg"></div>

    <button class="go" id="btnRetry">다시 사랑하기</button>

  <div id="nogl">이 브라우저에서는 3D를 켤 수 없습니다.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

/* ═══════════════════════════════════════════════════════════
   오락실 공용 서버 (지네·고래·지게차·3층·나자신과 같은 웹앱)
     조회  GET  {ENDPOINT}?game=selflove&callback=fn  → [{n,d,t}, ...]
     등록  POST {ENDPOINT}  text/plain
           {game:"selflove", id, name, score, secs}
   기기 id 기준으로 최고 기록 한 줄만 남습니다. 이름은 매번 최신 것으로 덮습니다.
   score 는 서버에서 플레이 시간(secs)과 대조해 걸러냅니다.
   ═══════════════════════════════════════════════════════════ */
const ENDPOINT="https://script.google.com/macros/s/AKfycbzKmIYdOCYXNwXbNzvZWR2mQZk59Hhbpk7le-86VGqwzrgJZYqwGegYmRHcKhQ59fVV/exec";

function store(k,v){
  try{ if(v===undefined)return localStorage.getItem(k)||"";
       localStorage.setItem(k,v); }catch(e){}
  return v||"";
}
const MYID=(function(){
  let v=store("selflove_id");
  if(!/^[A-Za-z0-9]{8,16}$/.test(v)){
    v=""; const c="abcdefghijklmnopqrstuvwxyz0123456789";
    for(let i=0;i<14;i++)v+=c[Math.floor(Math.random()*c.length)];
    store("selflove_id",v);
  }
  return v;
})();

function jsonp(url,ms){
  return new Promise((res,rej)=>{
    const cb="slcb"+Math.random().toString(36).slice(2,10);
    const s=document.createElement("script");
    let done=false;
    const clean=()=>{ try{delete window[cb];}catch(e){window[cb]=void 0;}
                      if(s.parentNode)s.parentNode.removeChild(s); };
    window[cb]=d=>{done=true;clean();res(d);};
    s.onerror=()=>{ if(!done){clean();rej(new Error("net"));} };
    s.src=url+(url.indexOf("?")<0?"?":"&")+"callback="+cb;
    document.head.appendChild(s);
    setTimeout(()=>{ if(!done){clean();rej(new Error("timeout"));} },ms||9000);
  });
}

const RANK={
  GAME:"selflove", TOP_N:100,
  async top(){
    const rows=await jsonp(ENDPOINT+"?game="+this.GAME);
    return Array.isArray(rows)?rows:[];
  },
  async submit(name,score,secs){
    try{
      await fetch(ENDPOINT,{method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({game:this.GAME,id:MYID,name,
                             score:Math.round(score),secs:Math.round(secs)})});
    }catch(e){/* 응답을 못 읽어도 기록은 들어갑니다. 목록으로 확인합니다. */}
    await new Promise(r=>setTimeout(r,450));
    return await this.top();
  }
};

/* ══════════ 밸런스 ══════════
   얼굴은 기본으로 나를 쳐다본다. 가끔 뒤로 돌아설 때만 나를 사랑할 수 있다.
   돌아서는 척(peek)과 돌아보는 척(fake)이 섞인다. 진짜로 돌아볼 때만 예비동작이 붙는다.
   돌아서 있는 시간은 90초에 걸쳐 줄어들고, 인내심은 회복되지 않는다.             */
const P={
  watchMin:1.6, watchMax:3.4,                     // 쳐다보는 시간
  leaveDur:0.6,                                   // 돌아서는 데 걸리는 시간
  awayMin:2.4, awayMax:4.8, awayFloorMin:0.8, awayFloorMax:2.4,   // 돌아서 있는 시간 (처음 → 90초 뒤)
  windDur:0.34, windFloor:0.20,
  turnDur:0.95, turnFloor:0.50,
  fakeBack:0.15, fakeBackMax:0.55,                // 돌아보는 척
  fakeAway:0.15, fakeAwayMax:0.40,                // 돌아서는 척
  rampTime:90,

let lineBag=[],lastLine="";

  if(!lineBag.length){
    lineBag=LINES.slice();
    for(let i=lineBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=lineBag[i];lineBag[i]=lineBag[j];lineBag[j]=t;}

/* ══════════ 소리 ══════════ */
let AC=null,sndOn=true,NOISE=null;

/* 브라운 노이즈 — 물기 있는 소리의 재료 */
function nbuf(){
  const c=ac(); if(!c)return null;

    const n=Math.floor(c.sampleRate*2.5);
    NOISE=c.createBuffer(1,n,c.sampleRate);

    for(let i=0;i<n;i++){const w=Math.random()*2-1;last=(last+0.022*w)/1.022;d[i]=last*3.4;}
  }

}
function now(){const c=ac();return c?c.currentTime:0;}

/* 목구멍 소리 — 톱니를 성대처럼 굴려서 포먼트를 씌운다 */
function throat(at,f0,f1,dur,vol,formants,growl){
  if(!sndOn)return;const c=ac();if(!c)return;
  const t0=now()+at;
  const o=c.createOscillator(); o.type="sawtooth";
  o.frequency.setValueAtTime(f0,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(28,f1),t0+dur);
  const o2=c.createOscillator(); o2.type="square"; o2.detune.value=-14;
  o2.frequency.setValueAtTime(f0*0.5,t0);
  o2.frequency.exponentialRampToValueAtTime(Math.max(20,f1*0.5),t0+dur);
  const o2g=c.createGain(); o2g.gain.value=0.35; o2.connect(o2g);
  // 그르렁거림
  const lfo=c.createOscillator(); lfo.type="sine"; lfo.frequency.value=growl||24;
  const lg=c.createGain(); lg.gain.value=f0*0.28;
  lfo.connect(lg); lg.connect(o.frequency);
  const mix=c.createGain();
  (formants||[[500,7,1],[1100,9,.6],[2300,6,.25]]).forEach(([f,q,a])=>{

    const fg=c.createGain(); fg.gain.value=a;
    o.connect(bp); o2g.connect(bp); bp.connect(fg); fg.connect(mix);

  g.gain.setValueAtTime(.0001,t0);

  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  mix.connect(g); g.connect(out());

/* 젖은 노이즈 — 필터를 쓸어내려 흐르는 느낌 */
function wet(at,dur,vol,f0,f1,q,type){

  f.frequency.setValueAtTime(f0,t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(50,f1),t0+dur);
  f.Q.value=q||1;
  const g=c.createGain();
  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(.03,dur*.2));
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(out());

/* 꿀렁거림 */

  if(!sndOn)return;const c=ac();if(!c)return;
  const t0=now()+at;
  const s=c.createBufferSource(); s.buffer=nbuf(); s.loop=true;
  const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=480; bp.Q.value=7;
  const lfo=c.createOscillator(); lfo.type="sine"; lfo.frequency.value=rate||10;

  g.gain.setValueAtTime(.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+.06);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);

/* 통통 튀는 음 */
function pluck(at,f,vol,dur){

function pop(at,f0,f1,vol,dur){

function slide(at,f0,f1,dur,vol){

/* 모든 소리는 압축기를 한 번 거쳐 나간다 — 겹쳐도 찢어지지 않고 타격이 단단해진다 */
let OUT=null;

  const s=c.createBufferSource();s.buffer=nbuf();s.loop=true;s.playbackRate.value=.85+Math.random()*.3;

  f.frequency.setValueAtTime(f0,t0);f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);

/* 몸에 닿는 둔탁한 소리 — 낮게 꺼지는 사인 + 짧은 마찰 */

  const handGhosts=[.35,.18].map(op=>{const g=hand.clone();g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.uniforms.uOp.value=op;o.material.transparent=true;o.material.depthWrite=false;}});scene.add(g);return g;});

  /* ── 매 프레임 ── */
  const tmpV=new THREE.Vector3(),mw=new THREE.Vector3();
  let W=360,Hh=640,prevYaw=PI;
  const hist=[],pa=POSES.idle.slice(),hT=[0,0];
  // 잔상은 시간 기준으로 늦춘다 — 프레임 수가 달라도 번지는 폭이 같다
  function yawAt(t){
    if(!hist.length)return prevYaw;
    if(t<=hist[0][0])return hist[0][1];
    for(let i=hist.length-1;i>0;i--){const a=hist[i-1],b=hist[i];
      if(a[0]<=t&&t<=b[0]){const k=(t-a[0])/Math.max(1e-6,b[0]-a[0]);return a[1]+(b[1]-a[1])*k;}}
    return hist[hist.length-1][1];
  }
  function reset(){hist.length=0;prevYaw=PI;for(let i=0;i<6;i++)pa[i]=POSES.idle[i];hT[0]=hT[1]=0;}
  function resize(){
    const w=canvas.clientWidth||360,h=canvas.clientHeight||640;W=w;Hh=h;
    renderer.setSize(w,h,false);const a=w/h;camera.aspect=a;
    // 내 발이 하단 버튼 위에 오고(세로), 우리가 좌우로 잘리지 않게(가로) 시야를 정한다
    const hud=document.getElementById("hud");
    const f=clamp(((hud?hud.offsetTop:h*.82)-8)/h,.7,.95);
    const tv=Math.max(.254/(2*f-1),.1828/a,Math.tan(18*PI/180));
    camera.fov=2*Math.atan(tv)*180/PI;
    camera.position.set(.9,2.75,13.5);camera.lookAt(0,2.65,0);camera.updateProjectionMatrix();
  }
  const handAt=st=>{let x,y,rz;
    if(st<.30){const e=1-Math.pow(1-st/.30,2);x=6.5-2.6*e;y=2.2+.9*e;rz=-.15-.45*e;}
    else if(st<.58){const e=Math.pow((st-.30)/.28,1.6);x=3.9-8.6*e;y=3.1-1.3*e;rz=-.6+1.2*e;}
    else{const e=st-.58;x=-4.7-e*12;y=1.8+e*.6;rz=.6+e*.5;}return [x,y,rz];};
  function render(S,dt){
    const t=S.t,gag=S.gag,puke=S.puke,spit=S.spit>=0?S.spit:-1;
    const gl=.7+.6*clamp((S.hp||0)/5,0,1);   // 들킬수록 헛구역질이 세진다
    const dy=S.yaw-prevYaw;prevYaw=S.yaw;
    hist.push([t,S.yaw]);while(hist.length>2&&hist[0][0]<t-.4)hist.shift();
    spin.rotation.y=S.yaw;
    const w=Math.abs(dy)/Math.max(dt,1/240),speed=clamp(w*.45,0,1.4);
    let tw=-.55*S.coil*Math.sign(Math.sin(S.yaw)||1)+(dy>0?-1:1)*speed*.45;
    if(gag>0)tw+=Math.sin(t*23)*.12*gag*gl;
    headMat.uniforms.uTwist.value=tw;
    headMat.uniforms.uDrag.value=clamp(-Math.sign(dy)*w*.3,-.6,.6)+(S.coil>0?Math.sin(t*50)*.06*S.coil:0);
    capeMat.uniforms.uTwist.value=tw*.4;
    const mouth=puke?1:spit>=0?.85:gag>0?Math.min(1,(.35+.35*Math.abs(Math.sin(t*9)))*gl):(S.mode==="stare"||S.mode==="front")?.06:0;
    headMat.uniforms.uMouth.value=mouth;headMat.uniforms.uGreen.value=Math.min(1,gag*.7*gl+(puke||spit>=0?.35:0));
    head.rotation.x=gag>0&&!puke?.12*gag*gl:puke?.18:0;
    const moving=speed>.05;
    ghosts.forEach((gh,i)=>{
      gh.rotation.y=moving?yawAt(t-(i+1)*.045):S.yaw;
      if(S.coil>0)gh.rotation.y+=(i%2?-1:1)*.12*(i+1)*S.coil;
      if(gag>0&&!moving)gh.rotation.y=S.yaw+Math.sin(t*17+i*2)*.08*gag;
      gh.rotation.x=head.rotation.x;
      const u=gh.material.uniforms;u.uTwist.value=tw*(1+.4*(i+1));u.uMouth.value=mouth;u.uGreen.value=headMat.uniforms.uGreen.value;
      gh.visible=moving||S.coil>0||gag>0;
      gh.position.x=(gag>0?Math.sin(t*19+i)*.08*gag*gl:0)+(S.coil>0?(i%2?1:-1)*(.16+.12*i)*S.coil*(.65+.35*Math.sin(t*38+i*2)):0);
    });
    veil.material.uniforms.uA.value=.3+.3*S.coil+.2*gag;
    bust.position.y=S.coil>0?-.1*S.coil:0;
    /* 토사물 — 찔끔(3·4번째)과 마지막 왕창. 웅덩이는 판이 끝날 때까지 남는다 */
    vom.visible=false;vomS.visible=false;vomPool.visible=false;
    if(puke||spit>=0){bust.updateMatrixWorld(true);mw.set(0,-.48,.9);head.localToWorld(mw);}
    if(puke){
      const L=Math.min(1,.15+S.pukeT*.6);
      for(let i=0;i<NV;i++){const k=i/(NV-1)*L;vpts[i].set(mw.x+(PX-mw.x)*k+Math.sin(k*9+t*14)*.06,mw.y-(mw.y-.05)*Math.pow(k,1.4),mw.z+(PZ-mw.z)*k);}
      vom.geometry.update(vpts);vom.visible=true;
    }else if(spit>=0){
      const L=Math.min(1,.1+spit*2.4);
      for(let i=0;i<NV;i++){const k=i/(NV-1)*L;vptsS[i].set(mw.x+(PX-mw.x)*k+Math.sin(k*9+t*16)*.04,mw.y-(mw.y-.05)*Math.pow(k,1.4),mw.z+(PZ-mw.z)*k);}
      vomS.geometry.update(vptsS);vomS.visible=true;
    }
    {const pd=S.puddle||0,pr=puke?Math.min(1,S.pukeT/1.8):0;
     const ps=Math.max(pd>0?.45+1.5*pd:0,puke?.5+2.3*pr:0);
     if(ps>0){vomPool.visible=true;vomPool.position.set(PX,.03,PZ);vomPool.scale.set(ps,ps*.45,1);}}
    /* 나 */
    const k=Math.min(1,dt*12),tg=POSES[S.pose]||POSES.idle;
    for(let i=0;i<6;i++)pa[i]+=(tg[i]-pa[i])*k;
    armL.sh.rotation.set(pa[0],0,pa[1]);armL.el.rotation.x=pa[2];armR.sh.rotation.set(pa[3],0,pa[4]);armR.el.rotation.x=pa[5];
    const hq=HEADP[S.pose]||HEADP.idle;hT[0]+=(hq[0]-hT[0])*k;hT[1]+=(hq[1]-hT[1])*k;
    kHead.rotation.x=hT[0];kHead.rotation.z=hT[1];
    mirror.visible=S.pose==="mirror";
    const shock=S.pose==="shock"||S.count>0;
    kFaceM.uniforms.uMouth.value=shock?.55:S.pose==="kiss"?.15:0;
    kFaceM.uniforms.uTwist.value=shock?Math.sin(t*30)*.35:(S.poseT<.2?(1-S.poseT/.2)*.5:0);
    me.position.set(.75,Math.sin(t*1.15)*.012,3.0);me.rotation.set(0,-.12,0);me.scale.setScalar(1.05);
    if(S.shockT>=0&&S.shockT<.4)me.position.y=.18*Math.sin(S.shockT/.4*PI);
    if(S.flyT>=0){const f=S.flyT;me.position.x+=-9.5*f;me.position.y+=4.4*f-8*f*f;me.rotation.z=11*f;me.rotation.y=-.12+4*f;}
    mePool.visible=S.flyT<0;
    /* 손 */
    [hand,...handGhosts].forEach((h,i)=>{const st=S.slapT-i*.035;
      if(S.slapT>=0&&S.slapT<1.6&&st>=0){h.visible=true;const p=handAt(st);h.position.set(p[0],p[1],3.0);h.rotation.set(0,PI*.5-.75,p[2]);}
      else h.visible=false;});
    renderer.render(scene,camera);
    tmpV.set(0,.42,0);kHead.localToWorld(tmpV);tmpV.project(camera);
    return [(tmpV.x*.5+.5)*W,(-tmpV.y*.5+.5)*Hh];
  }
  resize();window.addEventListener("resize",resize);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize);
  return {render,resize,reset};
}

/* ══════════ 자세 ══════════ */
let poseCur="idle",poseT=9;
function setPose(k){if(k!==poseCur){poseCur=k;poseT=0;}}

/* ══════════ 상태 ══════════ */
let G=null,freeze=0,clock=0;
function buildPatience(){
  const p=document.getElementById("pat");p.innerHTML="";
  for(let i=0;i<P.patience;i++)p.appendChild(document.createElement("div"));
}
function drawPatience(){
  const left=P.patience-(G?G.hp:0);
  const cls=["","s1","s2","s3","s4"];
  document.querySelectorAll("#pat div").forEach((d,i)=>{
    d.className="";
    if(i>=left){d.classList.add("off");}
    else{ const stage=Math.max(0,Math.min(4,P.patience-left)); if(cls[stage])d.classList.add(cls[stage]); }
  });
}
function newGame(){
  G={run:true,over:false,t:0,score:0,holding:false,prog:0,cd:0,tier:-1,hp:0,
     face:{mode:"front",yaw:0,t:0,wait:1.8+Math.random()*.8,fake:false,fakeAt:1,turn:P.turnDur,wind:P.windDur,coil:0,
           fakes:0,peeks:0,from:0,peekTo:1.5,peekHold:.15},
     gagT:0,pukeT:0,pukeE:0,shockT:0,slapT:-1,hit:false,sigh:false,
     wasted:0,winUsed:true,stareT:0,spitT:-9,spitDone:true,puddle:0};
  document.getElementById("scoreNum").textContent="0";
  setPose("idle"); if(BC)BC.reset();
  renderStage(); document.getElementById("say").classList.remove("on");
  document.getElementById("hold").classList.remove("cool");
  buildPatience(); drawPatience(); cntNow=-1; setCount(0);
}
function ramp(){return Math.min(1,G.t/P.rampTime);}
const lerp=(a,b,k)=>a+(b-a)*k;
function drawWatch(f){f.wait=P.watchMin+Math.random()*(P.watchMax-P.watchMin);}
/* 돌아서 있을 시간과, 그 끝에 진짜로 돌아볼지 돌아보는 척만 할지 정한다 */
function drawAway(f){
  const k=ramp();
  const mx=lerp(P.awayMax,P.awayFloorMax,k),mn=lerp(P.awayMin,P.awayFloorMin,k);
  f.wait=mn+Math.random()*(mx-mn);
  f.turn=lerp(P.turnDur,P.turnFloor,k);
  f.wind=lerp(P.windDur,P.windFloor,k);
  f.fake=f.fakes<2&&Math.random()<lerp(P.fakeBack,P.fakeBackMax,k);
  // 페이크는 판정각 바로 앞(약 0.68rad)까지 들어왔다 되돌아간다
  f.fakeAt=.50+Math.random()*.17;
}
function tierAt(s){let i=-1;for(let k=0;k<TIERS.length;k++)if(s>=TIERS[k].at)i=k;return i;}
function buildLadder(){
  const l=document.getElementById("ladder");l.innerHTML="";
  TIERS.forEach((t,i)=>{const d=document.createElement("div");
    if(i===TIERS.length-1)d.className="top";l.appendChild(d);});
  const tk=document.querySelector("#hold .ticks");tk.innerHTML="";
  TIERS.slice(0,-1).forEach(t=>{const i=document.createElement("i");
    i.style.left=(t.at/MAXT*100)+"%";tk.appendChild(i);});
}
function renderStage(){
  const i=G?G.tier:-1;
  document.getElementById("stageName").innerHTML=i<0?"&nbsp;":TIERS[i].name;
  document.getElementById("stagePt").textContent=i<0?"":"+"+TIERS[i].pt;
  document.querySelectorAll("#ladder div").forEach((d,k)=>d.classList.toggle("on",k<=i));
  document.getElementById("hold").classList.toggle("top",i===TIERS.length-1);
}

/* ══════════ 입력 ══════════ */
const holdBtn=document.getElementById("hold");
function pressDown(e){
  if(e)e.preventDefault(); ac();
  if(!G||!G.run||G.holding||G.cd>0||G.gagT>0)return;
  G.holding=true;G.prog=0;G.tier=-1;setCount(0);
  setPose("ready");
  holdBtn.classList.add("down");
  document.getElementById("say").classList.remove("on");
  renderStage();
}
function pressUp(e){
  if(!G||!G.holding)return;
  if(e&&e.cancelable)e.preventDefault();
  bank();
}
function bank(){
  const i=G.tier;
  if(i>=0){
    G.score+=TIERS[i].pt;
    const n=document.getElementById("scoreNum");
    n.textContent=G.score;n.classList.remove("bump");void n.offsetWidth;n.classList.add("bump");
    const g=document.getElementById("gain");
    g.textContent="+"+TIERS[i].pt;g.classList.remove("on");void g.offsetWidth;g.classList.add("on");
    SFX.bank();
    G.winUsed=true;                 // 이번 틈을 썼다
  }
  G.cd=P.cooldown; release();
}
function release(){
  if(!G)return;
  G.holding=false;G.prog=0;G.tier=-1;
  holdBtn.classList.remove("down");
  holdBtn.querySelector(".fill").style.width="0%";
  document.getElementById("say").classList.remove("on");
  setPose("idle"); renderStage();
}
holdBtn.addEventListener("mousedown",pressDown);
holdBtn.addEventListener("touchstart",pressDown,{passive:false});
window.addEventListener("mouseup",pressUp);
window.addEventListener("touchend",pressUp,{passive:false});
window.addEventListener("touchcancel",pressUp,{passive:false});
window.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!e.repeat&&document.activeElement!==document.getElementById("nameIn")){
    e.preventDefault();pressDown();}});
window.addEventListener("keyup",e=>{
  if(e.code==="Space"&&document.activeElement!==document.getElementById("nameIn")){
    e.preventDefault();pressUp();}});

function enterTier(i){
  G.tier=i;const T=TIERS[i];
  setPose(T.pose);SFX.tier(i);
  const s=document.getElementById("say");
  s.textContent=pickLine();
  s.classList.remove("side-l","side-r");
  s.classList.add(Math.random()<.5?"side-l":"side-r");
  s.classList.add("on");
  s.classList.remove("pop");void s.offsetWidth;s.classList.add("pop");
  renderStage();
}

/* ══════════ 들킴 ══════════ */
function caught(){
  const cost=(G.tier===TIERS.length-1)?P.topCost:1;
  G.hp=Math.min(P.patience,G.hp+cost);
  G.gagT=1.5; G.shockT=1.0; G.wasted=0; G.stareT=0;
  drawPatience();
  const app=document.getElementById("app");
  app.classList.remove("shake");void app.offsetWidth;app.classList.add("shake");
  const pt=document.getElementById("pat");
  pt.classList.remove("hit");void pt.offsetWidth;pt.classList.add("hit");
  const fl=document.getElementById("flash");
  fl.classList.remove("on");void fl.offsetWidth;fl.classList.add("on");
  SFX.caught();freeze=.13;
  // 헛구역질(1.5초) 보다 쿨다운을 길게 잡아, 그 사이에 안전하게 벌 수 없게 한다
  release(); setPose("shock"); G.cd=P.gagLock; setCount(0);
  // 헛구역질이 끝나면 다시 쳐다보는 데서 시작한다
  const f=G.face; f.mode="front"; f.t=0; f.coil=0; f.peeks=0; drawWatch(f);
  if(G.hp>=P.patience){endGame(true);return;}
  // 세 번째부터는 헛구역질 끝에 찔끔 토한다 — 바닥에 고인 게 판이 끝날 때까지 남는다
  if(G.hp>=3){G.spitT=-.55;G.spitDone=false;}
}

/* ══════════ 루프 ══════════ */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>.1)dt=.1;
  clock+=dt;
  if(freeze>0){freeze-=dt;render(dt*.15);return;}
  if(!G){render(dt);return;}
  if(G.run){
    G.t+=dt;
    if(G.cd>0)G.cd-=dt;
    holdBtn.classList.toggle("cool",G.cd>0);
    stepFace(dt);
    // 헛구역질 중 무적을 없앴다. 대신 그 동안은 아예 누를 수 없다.
    if(G.holding&&G.tier>=0&&!G.over){
      if(Math.abs(wrap(G.face.yaw))<P.catchAngle)caught();
    }
    if(G.holding){
      G.prog+=dt;
      holdBtn.querySelector(".fill").style.width=(Math.min(1,G.prog/MAXT)*100)+"%";
      const t=tierAt(G.prog);
      if(t>G.tier)enterTier(t);
    }
  }
  if(G.slapT>=0){
    G.slapT+=dt;
    // 날아간 뒤 — 얼굴이 아무 일 없었다는 듯 천천히 등을 돌린다
    if(G.slapT>1.5)G.face.yaw+=(Math.PI-G.face.yaw)*Math.min(1,dt*1.5);
    if(G.slapT>2.3&&!G.sigh){G.sigh=true;SFX.sigh();}
    if(G.slapT>3.7&&!G.over)endGame(false);
  }
  if(G.gagT>0)G.gagT-=dt;
  if(G.spitT>-9){
    G.spitT+=dt;
    if(!G.spitDone&&G.spitT>=0){G.spitDone=true;SFX.spit();}
    if(G.spitT>=0&&G.spitT<1.1)G.puddle=Math.min(1,G.puddle+.34*dt/1.1);
    if(G.spitT>=1.1)G.spitT=-9;
  }
  if(G.pukeT>0){G.pukeT-=dt;G.pukeE=(G.pukeE||0)+dt;}
  if(G.shockT>0){G.shockT-=dt; if(G.shockT<=0&&!G.over)setPose("idle");}
  render(dt);
}
let cntNow=0;
function setCount(n){
  const el=document.getElementById("cnt");
  if(n===cntNow)return;
  cntNow=n;
  if(n<=0){el.classList.remove("on");return;}
  el.textContent=n;
  el.classList.add("on");
  el.classList.remove("tick");void el.offsetWidth;el.classList.add("tick");
  SFX.count(n);
}
function wrap(a){a=a%(Math.PI*2);if(a>Math.PI)a-=Math.PI*2;if(a<-Math.PI)a+=Math.PI*2;return a;}

function stepFace(dt){
  const f=G.face;
  if(G.gagT>0||G.pukeT>0){f.yaw+=(0-wrap(f.yaw))*Math.min(1,dt*6);f.coil=0;return;}
  f.t+=dt;
  const rk=ramp();
  switch(f.mode){
    case "front":                       // 쳐다본다
      f.yaw=Math.sin(clock*1.4)*.05; f.coil=0;
      if(f.t>=f.wait){
        if(G.wasted>=P.wasteLimit){f.mode="stare";f.t=0;G.stareT=0;break;}
        if(f.peeks<2&&Math.random()<lerp(P.fakeAway,P.fakeAwayMax,rk)){
          // 돌아서는 척 — 옆얼굴까지만 돌고 휙 돌아온다
          f.mode="peek";f.t=0;f.peeks++;f.peekTo=1.3+Math.random()*.9;f.peekHold=.12+Math.random()*.13;SFX.turn();
        }else{f.mode="leave";f.t=0;f.peeks=0;f.from=f.yaw;SFX.turn();}
      }
      break;
    case "peek":{
      const a=.32,h=f.peekHold,b=.22;
      if(f.t<a){const e=1-Math.pow(1-f.t/a,2);f.yaw=f.peekTo*e;}
      else if(f.t<a+h){f.yaw=f.peekTo;}
      else if(f.t<a+h+b){const e=Math.pow((f.t-a-h)/b,2);f.yaw=f.peekTo*(1-e);}
      else{f.yaw=0;f.mode="front";f.t=0;f.wait=.8+Math.random()*1.0;}
      break;}
    case "leave":{                      // 진짜로 돌아선다 — 다 돌아선 뒤부터가 기회
      const q=Math.min(1,f.t/P.leaveDur),e=q<.5?2*q*q:1-Math.pow(-2*q+2,2)/2;
      f.yaw=f.from+(Math.PI-f.from)*e;
      if(q>=1){f.mode="away";f.t=0;f.fakes=0;G.winUsed=false;drawAway(f);}
      break;}
    case "away":
      f.yaw=Math.PI+Math.sin(clock*.7)*.12; f.coil=0;
      if(f.t>=f.wait){
        // 진짜로 돌아볼 때만 예비동작이 붙는다. 페이크는 예고 없이 바로 돈다.
        if(f.fake){f.mode="turn";f.t=0;SFX.turn();}
        else{f.mode="wind";f.t=0;SFX.wind();}
      }
      break;
    case "wind":{                       // 겹쳐 떨린다 — 고개를 더 돌리며 숙였다가 제자리
      const k=Math.min(1,f.t/f.wind);
      const s=Math.sin(k*Math.PI);
      f.coil=s;
      f.yaw=Math.PI+0.22*s;
      if(k>=1){f.coil=0;f.mode="turn";f.t=0;SFX.turn();}
      break;}
    case "turn":{
      const k=Math.min(1,f.t/f.turn);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      f.yaw=Math.PI*(1-e);
      if(f.fake&&k>=f.fakeAt){f.mode="fake";f.t=0;f.from=f.yaw;}
      else if(k>=1){
        f.mode="front";f.t=0;drawWatch(f);
        // 이번 틈에 아무것도 안 했으면 센다
        if(G.winUsed)G.wasted=0;else G.wasted++;
      }
      break;}
    case "fake":{                       // 돌아보는 척하다 다시 돌아선다 — 틈이 새로 열린다
      const k=Math.min(1,f.t/.5);
      f.yaw=f.from+(Math.PI-f.from)*k;
      if(k>=1){f.mode="away";f.t=0;f.fakes++;drawAway(f);}
      break;}
    case "stare":{                      // 노려보다가 카운트다운 → 후려친다
      f.yaw+=(0-wrap(f.yaw))*Math.min(1,dt*4); f.coil=0;
      G.stareT+=dt;
      setCount(G.stareT<P.stareHold?0:Math.max(1,3-Math.floor(G.stareT-P.stareHold)));
      if(G.stareT>=P.stareHold+3&&G.slapT<0){setCount(0);G.slapT=0;G.run=false;SFX.whoosh();}
      break;}
  }
}

const sayEl=document.getElementById("say"),appEl=document.getElementById("app");
let sayW=0,sayTxt="";
window.addEventListener("resize",()=>{sayW=0;});
/* 말풍선은 내 머리 위에 붙이고, 화면 밖으로 나가지 않게 가둔다 */
function placeSay(xy){
  if(!xy||!sayEl.classList.contains("on"))return;
  if(sayEl.textContent!==sayTxt){sayTxt=sayEl.textContent;sayW=0;}
  if(!sayW)sayW=sayEl.offsetWidth;
  const fw=appEl.clientWidth,af=sayEl.classList.contains("side-r")?.18:.82;
  const left=clamp(xy[0]-af*sayW,10,Math.max(10,fw-10-sayW));
  sayEl.style.left=left.toFixed(1)+"px";sayEl.style.top=(xy[1]-8).toFixed(1)+"px";
  sayEl.style.setProperty("--tx",clamp(xy[0]-left,16,Math.max(16,sayW-16)).toFixed(1)+"px");
}
function render(dt){
  if(!ok3d||!BC)return;
  poseT+=dt;
  const g=G;
  const gag=g&&g.gagT>0?Math.min(1,g.gagT/1.0):0, puke=!!(g&&g.pukeT>0);
  // 손이 몸을 지나는 순간 맞는다
  if(g&&g.slapT>=.46&&!g.hit){
    g.hit=true;SFX.slap();
    appEl.classList.remove("shake");void appEl.offsetWidth;appEl.classList.add("shake");
  }
  const xy=BC.render({t:clock,yaw:g?g.face.yaw:Math.PI,coil:g?(g.face.coil||0):0,mode:g?g.face.mode:"away",
    gag:puke?1:gag,puke,pukeT:g?(g.pukeE||0):0,hp:g?g.hp:0,pose:poseCur,poseT,count:cntNow>0?cntNow:0,
    shockT:g&&g.shockT>0?1-g.shockT:-1,slapT:g?g.slapT:-1,flyT:g&&g.slapT>=.46?g.slapT-.46:-1,
    spit:g&&g.spitT>=0&&g.spitT<1.1?g.spitT/1.1:-1,puddle:g?(g.puddle||0):0},dt);
  placeSay(xy);
}

function endGame(vomit){
  if(G.over)return;
  G.over=true;G.run=false;
  document.getElementById("endScore").textContent=G.score;
  document.getElementById("hold").classList.remove("cool");
  if(vomit){
    G.pukeT=999;SFX.puke();
    setTimeout(()=>{SFX.quiet();openEnd();},2600);
  }else{SFX.quiet();setTimeout(openEnd,520);}
}
let lastName=store("selflove_name");
function openEnd(){
  document.getElementById("ovEnd").classList.remove("hide");
  const b=document.getElementById("btnSubmit"),i=document.getElementById("nameIn");
  b.disabled=false;b.textContent="등록";i.disabled=false;i.value=lastName;
  document.getElementById("rankMsg").textContent="";
  fillRank("rankList","rankMsg",null);
}
async function fillRank(listId,msgId,mine){
  const ul=document.getElementById(listId), msg=document.getElementById(msgId);
  ul.innerHTML="<li><span class='w'>불러오는 중</span></li>";
  if(msg)msg.textContent="";
  try{
    drawRank(ul,await RANK.top(),mine);
  }catch(e){
    ul.innerHTML="";
    if(msg)msg.textContent="순위를 불러오지 못했습니다.";
  }
}
function drawRank(ul,rows,mine){
  ul.innerHTML="";
  if(!rows||!rows.length){ul.innerHTML="<li><span class='w'>아직 기록이 없습니다</span></li>";return;}
  rows.forEach((r,i)=>{
    const li=document.createElement("li");
    if(mine&&r.n===mine.name&&Number(r.d)===Number(mine.score)&&!ul.querySelector(".mine"))
      li.className="mine";
    li.innerHTML='<span class="n">'+(i+1)+'</span><span class="w"></span>'+
                 '<span class="s">'+(Number(r.d)||0)+'</span>';
    li.querySelector(".w").textContent=String(r.n||"");
    ul.appendChild(li);
  });
}
document.getElementById("btnSubmit").addEventListener("click",async()=>{
  const inp=document.getElementById("nameIn"),btn=document.getElementById("btnSubmit"),
        msg=document.getElementById("rankMsg"),ul=document.getElementById("rankList");
  const name=inp.value.trim();
  if(!name){inp.focus();msg.textContent="이름을 적어주세요.";return;}
  lastName=name; store("selflove_name",name);
  btn.disabled=true;btn.textContent="등록 중";msg.textContent="";
  try{
    const rows=await RANK.submit(name,G.score,G.t);
    drawRank(ul,rows,{name,score:G.score});
    let at=-1;
    for(let i=0;i<rows.length;i++)
      if(rows[i].n===name&&Number(rows[i].d)===G.score){at=i;break;}
    inp.disabled=true;btn.textContent="등록됨";
    msg.textContent=at>=0?(at+1)+"위":"";
  }catch(e){
    btn.disabled=false;btn.textContent="등록";msg.textContent="등록에 실패했습니다.";
  }
});

/* ══════════ 우로보로스 — 붓으로 문지른 살색·보라 뱀 ══════════ */
(function(){
  const btn=document.getElementById("ouro");
  const cv=document.createElement("canvas");btn.appendChild(cv);
  const PAL={hi:"#FFF1E4",lt:"#FFE0CC",pk:"#F2A3A3",rs:"#E07A8A",mv:"#B85A8E",vi:"#6A2F8C",cr:"#9A2244"};
  function stroke(g,x,y,ang,len,wid,c,al){g.globalAlpha=al;g.strokeStyle=c;g.lineWidth=wid;g.lineCap="round";
    g.beginPath();g.moveTo(x-Math.cos(ang)*len/2,y-Math.sin(ang)*len/2);g.lineTo(x+Math.cos(ang)*len/2,y+Math.sin(ang)*len/2);g.stroke();}
  function draw(){
    const S=btn.clientWidth||240,d=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(S*d);cv.height=Math.round(S*d);
    const g=cv.getContext("2d");g.setTransform(cv.width/200,0,0,cv.height/200,0,0);g.clearRect(0,0,200,200);
    const r=rng(7),cx=100,cy=94,R=58,a0=72*PI/180,sw=342*PI/180;
    const wd=t=>3.2+17.5*Math.pow(1-t,1.1);
    const P=(a,rr)=>[cx+rr*Math.cos(a),cy+rr*Math.sin(a)];
    // 그림자 웅덩이
    g.globalAlpha=1;g.fillStyle="rgba(58,20,48,.45)";g.beginPath();g.ellipse(104,172,74,13,0,0,PI*2);g.fill();
    // 몸통 바탕
    g.beginPath();
    for(let i=0;i<=120;i++){const t=i/120,p=P(a0+sw*t,R+wd(t));g[i?"lineTo":"moveTo"](p[0],p[1]);}
    for(let i=120;i>=0;i--){const t=i/120,p=P(a0+sw*t,R-wd(t));g.lineTo(p[0],p[1]);}
    g.closePath();g.fillStyle=PAL.mv;g.fill();
    // 붓질 — 바깥 위쪽은 빛을 받아 밝고, 안쪽 아래는 보라로 가라앉는다
    for(let i=0;i<1900;i++){
      const t=r(),a=a0+sw*t,w=wd(t),u=r()*2-1,p=P(a,R+u*w*.92);
      const nx=Math.cos(a)*u,ny=Math.sin(a)*u;
      const lit=clamp(.44-.6*(nx*.6+ny*.8)+(r()-.5)*.6,0,1);
      const c=r()<.05?PAL.cr:lit>.88?PAL.hi:lit>.76?PAL.lt:lit>.6?PAL.pk:lit>.46?PAL.rs:lit>.3?PAL.mv:PAL.vi;
      stroke(g,p[0],p[1],a+PI/2+(r()-.5)*.6,2.5+r()*7*(w/14+.35),1+r()*2.4*(w/14+.3),c,.5+r()*.45);
    }
    // 가로로 끌린 흰 자국
    for(let i=0;i<7;i++){const t=.08+r()*.7,a=a0+sw*t,p=P(a,R+(r()-.5)*wd(t));
      stroke(g,p[0],p[1],(r()-.5)*.25,10+r()*16,1.4+r()*1.6,PAL.hi,.55);}
    // 머리 — 제 꼬리를 문다
    const h=P(a0,R),tl=P(a0+sw,R),rot=Math.atan2(tl[1]-h[1],tl[0]-h[0]);
    g.save();g.translate(h[0],h[1]);g.rotate(rot);g.scale(1.5,1.5);g.globalAlpha=1;
    g.fillStyle="#3A0A18";g.beginPath();g.moveTo(-2,-6);g.lineTo(31,-3.5);g.lineTo(29,5);g.lineTo(-2,7);g.closePath();g.fill();
    g.fillStyle=PAL.pk;g.beginPath();g.moveTo(-6,-14);g.quadraticCurveTo(16,-17,35,-6);g.lineTo(27,-2.5);g.quadraticCurveTo(12,-6,-4,-4);g.closePath();g.fill();
    g.fillStyle=PAL.mv;g.beginPath();g.moveTo(-6,13);g.quadraticCurveTo(14,14,31,6);g.lineTo(25,3.8);g.quadraticCurveTo(11,7,-4,7);g.closePath();g.fill();
    g.fillStyle=PAL.hi;
    for(let i=0;i<5;i++){const x=4+i*5.5;
      g.beginPath();g.moveTo(x,-4.6+i*.5);g.lineTo(x+1.8,-1+i*.4);g.lineTo(x+3.4,-4.2+i*.5);g.closePath();g.fill();
      g.beginPath();g.moveTo(x+1,6-i*.3);g.lineTo(x+2.6,2.8-i*.2);g.lineTo(x+4.2,5.6-i*.3);g.closePath();g.fill();}
    g.fillStyle=PAL.rs;g.beginPath();g.ellipse(-6,0,18,14,0,0,PI*2);g.fill();
    for(let i=0;i<240;i++){const a=r()*PI*2,rr=Math.sqrt(r()),x=-6+Math.cos(a)*18*rr,y=Math.sin(a)*14*rr;
      const lit=clamp(.55-.45*(y/14)-.1*((x+6)/18)+(r()-.5)*.5,0,1);
      const c=lit>.75?PAL.hi:lit>.6?PAL.lt:lit>.45?PAL.pk:lit>.3?PAL.mv:PAL.vi;
      stroke(g,x,y,(r()-.5)*.5,2+r()*6,1+r()*2,c,.55+r()*.4);}
    g.globalAlpha=.92;g.fillStyle="#1E0A22";g.beginPath();g.ellipse(-2,-6,4.6,3.6,-.2,0,PI*2);g.fill();
    g.globalAlpha=.85;g.fillStyle=PAL.hi;g.beginPath();g.arc(-3.4,-7.2,1.1,0,PI*2);g.fill();
    g.restore();g.globalAlpha=1;
  }
  draw();window.addEventListener("resize",draw);
})();
